services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: treasury
      POSTGRES_PASSWORD: treasury
      POSTGRES_DB: treasury
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U treasury"]
      interval: 2s
      timeout: 2s
      retries: 15

  app:
    build: .
    image: treasury
    ports:
      - "8888:8888"
    environment:
      DATABASE_URL: postgres://treasury:treasury@db:5432/treasury
      OPERATOR_KEY: ${OPERATOR_KEY:?set OPERATOR_KEY in .env}
      RUST_LOG: info
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
